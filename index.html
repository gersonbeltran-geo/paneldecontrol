/* ── Almacenamiento compartido en Firestore (multiusuario) ───────────
   Requiere que se haya llamado antes a inicializarFirebase() con la
   configuración del proyecto. Mientras no esté lista, get/set no hacen nada. */
let dbFirestore = null;
let firebaseListo = false;
function inicializarFirebase(config) {
  if (firebase.apps.length) firebase.app().delete().catch(() => {});
  firebase.initializeApp(config);
  dbFirestore = firebase.firestore();
  return firebase.auth().signInAnonymously().then(() => {
    firebaseListo = true;
  });
}
function docKey(key) {
  return key.replace(/[^a-zA-Z0-9_-]/g, "_");
}
window.storage = {
  async get(key) {
    if (!firebaseListo) return null;
    const snap = await dbFirestore.collection("playgo_panel").doc(docKey(key)).get();
    if (!snap.exists) return null;
    return {
      value: snap.data().value
    };
  },
  async set(key, value) {
    if (!firebaseListo) throw new Error("Firebase no está listo todavía.");
    await dbFirestore.collection("playgo_panel").doc(docKey(key)).set({
      value,
      actualizado: firebase.firestore.FieldValue.serverTimestamp()
    });
    return {
      value
    };
  }
};

}
