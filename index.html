/* ── Almacenamiento compartido en Firestore (multiusuario) ───────────
   Requiere que se haya llamado antes a inicializarFirebase() con la
   configuración del proyecto. Mientras no esté lista, get/set no hacen nada. */
let dbFirestore = null;
let firebaseListo = false;

function inicializarFirebase(config) {
  if (firebase.apps.length) firebase.app().delete().catch(() => {});
  firebase.initializeApp(config);
  dbFirestore = firebase.firestore();
  return firebase.auth().signInAnonymously().then(() => { firebaseListo = true; });
}

function docKey(key) {
  return key.replace(/[^a-zA-Z0-9_-]/g, "_");
}

window.storage = {
  async get(key) {
    if (!firebaseListo) return null;
    const snap = await dbFirestore.collection("playgo_panel").doc(docKey(key)).get();
    if (!snap.exists) return null;
    return { value: snap.data().value };
  },
  async set(key, value) {
    if (!firebaseListo) throw new Error("Firebase no está listo todavía.");
    await dbFirestore.collection("playgo_panel").doc(docKey(key))
      .set({ value, actualizado: firebase.firestore.FieldValue.serverTimestamp() });
    return { value };
  },
};

/* ── Cabeceras para llamar a la API de Anthropic desde el navegador ──── */
function anthropicHeaders() {
  const key = localStorage.getItem("playgo:api-key") || "";
  return {
    "Content-Type": "application/json",
    "x-api-key": key,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
}

/* ────────────────────────────────────────────────────────────

   ──────────────────────────────────────────────────────────── */

const SECTORES = [
  { id: "turismo",   label: "Turismo",        tono: "#E8843C", glifo: "▲" },
  { id: "cultura",   label: "Cultura",        tono: "#B5527A", glifo: "◆" },

  { id: "rv_mixta",     label: "Realidad Virtual y Mixta",   tono: "#7C6BC4", glifo: "◉", desc: "Experiencias inmersivas con entornos y escenas virtuales en 3D" },

// Perfiles de empresa por defecto a rastrear en cada sector — guían la búsqueda con IA
const PERFILES_SECTOR = {
  turismo: ["cadenas hoteleras", "oficinas de turismo privadas", "agencias receptivas", "parques temáticos", "balnearios y spas", "campings y complejos rurales"],
  cultura: ["museos privados y fundaciones culturales", "salas de exposiciones", "productoras de eventos culturales", "empresas de gestión de patrimonio", "editoriales con proyectos patrimoniales"],
  educacion: ["colegios privados y concertados", "universidades privadas", "academias y centros de formación", "editoriales educativas", "centros de FP privados"],
  salud: ["clínicas y hospitales privados", "mutuas", "centros de rehabilitación", "empresas de prevención de riesgos laborales", "residencias y centros de mayores"],
  social: ["fundaciones y ONG con financiación privada", "empresas de economía social", "centros de inclusión", "asociaciones de accesibilidad"],
  ambiente: ["empresas de gestión ambiental", "espacios naturales de gestión privada", "empresas de energías renovables", "cooperativas agrícolas", "turismo de naturaleza"],
};

const STORAGE_KEY = "playgo:leads:v1";
const HISTORIAL_KEY = "playgo:historial-busquedas:v1";

const sectorDe = (id) => SECTORES.find((s) => s.id === id) || SECTORES[0];
const etapaDe = (id) => ETAPAS.find((e) => e.id === id) || ETAPAS[0];
const tecnologiaDe = (id) => TECNOLOGIAS.find((t) => t.id === id) || null;
const uid = () => Math.random().toString(36).slice(2, 10);

/* ── CSV ──────────────────────────────────────────────────── */

const CAMPOS = ["empresa", "sector", "etapa", "tecnologia", "tecnologia_motivo", "web", "contacto", "cargo", "email", "linkedin", "ubicacion", "senal", "notas", "email_asunto", "email_cuerpo", "creado"];

function aCSV(leads) {
  const esc = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return [CAMPOS.join(","), ...leads.map((l) => CAMPOS.map((c) => esc(l[c])).join(","))].join("\n");
}

function desdeCSV(texto) {
  const filas = [];
  let campo = "", fila = [], dentro = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (dentro) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }
        else dentro = false;
      } else campo += c;
    } else if (c === '"') dentro = true;
    else if (c === ",") { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      fila.push(campo); filas.push(fila); fila = []; campo = "";
    } else campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  if (!filas.length) return [];
  const cab = filas[0].map((h) => h.trim().toLowerCase());
  return filas.slice(1)
    .filter((f) => f.some((v) => v.trim()))
    .map((f) => {
      const o = { id: uid() };
      cab.forEach((h, i) => { if (CAMPOS.includes(h)) o[h] = (f[i] || "").trim(); });
      if (!SECTORES.some((s) => s.id === o.sector)) o.sector = "turismo";
      if (!ETAPAS.some((e) => e.id === o.etapa)) o.etapa = "nuevo";
      if (!TECNOLOGIAS.some((t) => t.id === o.tecnologia)) o.tecnologia = "";
      o.creado = o.creado || new Date().toISOString().slice(0, 10);
      return o;
    });
}

/* ── Búsqueda con IA ──────────────────────────────────────── */

const PROMPT_BUSQUEDA = (sector, matiz, conocidas) => {
  const perfiles = PERFILES_SECTOR[sector.id] || [];
  const tecs = TECNOLOGIAS.map((t) => `${t.id}=${t.label}`).join(", ");
  const exclusion = conocidas && conocidas.length
    ? `\nIntenta priorizar empresas distintas a estas ya en nuestra base, pero si no encuentras suficientes alternativas puedes incluir alguna igualmente: ${conocidas.slice(0, 40).join(", ")}.`
    : "";
  return `Analista de negocio de Play&go experience (XR: RA/RV/gamificación, Valencia). Busca en la web AL MENOS 10 EMPRESAS PRIVADAS ESPAÑOLAS del sector "${sector.label}" candidatas a contratar una experiencia XR.

Perfiles guía: ${perfiles.join(", ")}.${matiz ? ` Matiz: ${matiz}.` : ""}${exclusion}
Prioriza señales recientes: aperturas/reformas, ayudas de digitalización, ferias, ofertas de empleo de innovación, notas de prensa tech. Excluye administraciones y licitaciones públicas.

Tecnologías Play&go (elige la más afín por candidato): ${tecs}.

Responde SOLO con un array JSON, sin texto ni markdown, campos breves (máx 1 frase cada uno), mínimo 10 objetos:
[{"empresa":"","web":"","ubicacion":"","senal":"","notas":"","tecnologia":"","tecnologia_motivo":""}]`;
};

async function buscarLeads(sector, matiz, conocidas) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: anthropicHeaders(),
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 4096,
      messages: [{ role: "user", content: PROMPT_BUSQUEDA(sector, matiz, conocidas) }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (r.status === 429) throw new Error("Límite de peticiones a la API alcanzado. Espera unos segundos antes de volver a buscar.");
  if (!r.ok) throw new Error(`La búsqueda no respondió (${r.status}). Reinténtalo.`);
  const data = await r.json();
  const texto = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const limpio = texto.replace(/```json|```/g, "").trim();
  let ini = limpio.indexOf("["), fin = limpio.lastIndexOf("]");
  // Si el array viene envuelto en un objeto tipo {"empresas":[...]}, seguimos encontrando los mismos corchetes,
  // así que solo hace falta un segundo intento si no hay corchetes en absoluto.
  if (ini === -1) {
    console.error("Respuesta completa de la API (sin JSON legible):", JSON.stringify(data, null, 2));
    const fragmento = texto.trim().slice(0, 180).replace(/\s+/g, " ");
    throw new Error(fragmento
      ? `La IA respondió sin resultados en formato JSON: "${fragmento}${texto.length > 180 ? "…" : ""}". Prueba a afinar el matiz o vuelve a intentarlo.`
      : `La IA no devolvió texto legible (stop_reason: ${data.stop_reason || "desconocido"}, bloques: ${(data.content || []).map(b => b.type).join(", ") || "ninguno"}). Revisa la consola del navegador (F12) para ver la respuesta completa.`);
  }
  if (fin === -1 || fin < ini) {
    console.error("Respuesta de búsqueda truncada:", texto);
    throw new Error("La respuesta se cortó antes de terminar. Vuelve a intentarlo — suele funcionar a la segunda.");
  }
  let arr;
  try {
    arr = JSON.parse(limpio.slice(ini, fin + 1));
  } catch (e) {
    console.error("JSON inválido en respuesta de búsqueda:", limpio);
    throw new Error("La respuesta llegó con un formato inválido. Vuelve a intentarlo.");
  }
  if (!Array.isArray(arr) || !arr.length) throw new Error("Sin candidatos para esos criterios.");
  return arr.map((c) => ({ ...c, tecnologia: TECNOLOGIAS.some((t) => t.id === c.tecnologia) ? c.tecnologia : "" }));
}

/* ── Generación de email comercial con IA ────────────────────── */

const PROMPT_EMAIL = (lead) => {
  const t = tecnologiaDe(lead.tecnologia);
  return `Comercial de Play&go experience (XR, Valencia). Escribe un email breve y personalizado en español para:
Empresa: ${lead.empresa || "sin nombre"} | Sector: ${sectorDe(lead.sector).label} | Ubicación: ${lead.ubicacion || "n/d"}
Persona a la que se dirige: ${lead.contacto ? `${lead.contacto}${lead.cargo ? ` (${lead.cargo})` : ""}` : "no identificada, usa un saludo genérico"}
Señal: ${lead.senal || "n/d"} | Notas: ${lead.notas || "n/d"}
Tecnología a proponer: ${t ? `${t.label} (${t.desc})` : "la más afín al sector"}

Requisitos: asunto ≤8 palabras; menciona la señal sin inventar datos; propone la tecnología con 1 beneficio concreto; cierre con CTA de llamada de 15 min; tono cercano y profesional; cuerpo ≤120 palabras; firma "Equipo Play&go experience".

Responde SOLO con JSON: {"asunto":"","cuerpo":""}`;
};

async function generarEmail(lead) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: anthropicHeaders(),
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 500,
      messages: [{ role: "user", content: PROMPT_EMAIL(lead) }],
    }),
  });
  if (!r.ok) throw new Error(`No se pudo generar el email (${r.status}).`);
  const data = await r.json();
  const texto = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const limpio = texto.replace(/```json|```/g, "").trim();
  const ini = limpio.indexOf("{"), fin = limpio.lastIndexOf("}");
  if (ini === -1 || fin === -1) throw new Error("La respuesta no traía un email legible.");
  return JSON.parse(limpio.slice(ini, fin + 1));
}

/* ── Rebuscar solo el contacto de un lead ya guardado ─────────── */

const PROMPT_CONTACTO = (lead) => `Busca en la web la persona de contacto con más capacidad real de escuchar y decidir sobre una propuesta comercial de tecnología XR en esta empresa española:

Empresa: ${lead.empresa} | Sector: ${sectorDe(lead.sector).label} | Ubicación: ${lead.ubicacion || "n/d"}
Web: ${lead.web || "desconocida"}

NO busques al presidente, CEO ni dirección general, salvo que sea una empresa muy pequeña sin otro interlocutor posible. Prioriza en este orden: responsable de innovación/transformación digital, responsable de marketing o comunicación, responsable de experiencia de cliente/visitante, director comercial.

Para el email, busca en este orden: (1) la web oficial de la empresa (páginas de equipo, contacto, notas de prensa con firma), (2) resultados de Google que crucen el nombre de la persona con la empresa, (3) LinkedIn solo como última vía si no aparece en ningún otro sitio. El perfil de LinkedIn es un dato de apoyo (fallback), no el único contacto válido: intenta siempre dar también un email o, como mínimo, el cargo exacto de la persona para que se la pueda localizar por otra vía. Nunca inventes datos: si no encuentras alguno, deja el campo vacío.

Responde SOLO con JSON: {"contacto":"","cargo":"","email":"","linkedin":""}`;

async function buscarContacto(lead) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: anthropicHeaders(),
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      messages: [{ role: "user", content: PROMPT_CONTACTO(lead) }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!r.ok) throw new Error(`No se pudo buscar el contacto (${r.status}).`);
  const data = await r.json();
  const texto = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  const limpio = texto.replace(/```json|```/g, "").trim();
  const ini = limpio.indexOf("{"), fin = limpio.lastIndexOf("}");
  if (ini === -1 || fin === -1) throw new Error("No se encontró un contacto claro para esta empresa.");
  return JSON.parse(limpio.slice(ini, fin + 1));
}

function BloqueEmail({ lead, onCambiar }) {
  const [generando, setGenerando] = useState(false);
  const [error, setError] = useState("");
  const [copiado, setCopiado] = useState(false);
  const email = lead.email_asunto ? { asunto: lead.email_asunto, cuerpo: lead.email_cuerpo } : null;

  const generar = async () => {
    setGenerando(true); setError("");
    try {
      const r = await generarEmail(lead);
      onCambiar({ ...lead, email_asunto: r.asunto, email_cuerpo: r.cuerpo });
    } catch (e) {
      setError(e.message);
    }
    setGenerando(false);
  };

  const copiar = async () => {
    if (!email) return;
    try {
      await navigator.clipboard.writeText(`Asunto: ${email.asunto}\n\n${email.cuerpo}`);
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2000);
    } catch { /* portapapeles no disponible */ }
  };

  return (
    <div className="rounded-lg border border-[#1E232D] bg-[#0D1117] p-3.5">
      <div className="flex items-center justify-between">
        <span className="flex items-center gap-1.5 text-[11px] uppercase tracking-wide text-[#5C6478]">
          <Mail size={12} /> Email comercial
        </span>
        {!email && (
          <button

    try {

      onCambiar({
        ...lead,
        contacto: r.contacto || lead.contacto,
        cargo: r.cargo || lead.cargo,
        email: r.email || lead.email,
        linkedin: r.linkedin || lead.linkedin,
      });

      setError(e.message);

    setBuscando(false);

  return (
    <div className="flex items-center justify-between">

function Barra({ label, valor, total, tono }) {
  const pct = total ? Math.round((valor / total) * 100) : 0;
  return (
    <div className="mb-2.5">
      <div className="mb-1 flex items-center justify-between text-[12.5px]">
        <span className="text-[#A8B0C0]">{label}</span>
        <span className="tabular-nums text-[#6E7688]">{valor}</span>
      </div>
      <div className="h-1.5 w-full overflow-hidden rounded-full bg-[#1A1F29]">
        <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: tono }} />
      </div>
    </div>
  );
}

function TarjetaMetrica({ etiqueta, valor }) {
  return (
    <div className="rounded-xl border border-[#1E232D] bg-[#0E1219] p-4">
      <p className="text-[11px] uppercase tracking-wide text-[#5C6478]">{etiqueta}</p>
      <p className="mt-1.5 text-[24px] font-semibold tabular-nums text-[#F0F3F8]">{valor}</p>
    </div>
  );
}

function PanelControl({ leads }) {
  const total = leads.length;

  const porEtapa = useMemo(() => ETAPAS.map((e) => ({
    ...e, n: leads.filter((l) => l.etapa === e.id).length,
  })), [leads]);

  const porSector = useMemo(() => SECTORES.map((s) => ({
    ...s, n: leads.filter((l) => l.sector === s.id).length,
  })), [leads]);

  const porTecnologia = useMemo(() => TECNOLOGIAS.map((t) => ({
    ...t, n: leads.filter((l) => l.tecnologia === t.id).length,
  })), [leads]);

  const sinTecnologia = leads.filter((l) => !l.tecnologia).length;

  const porCiudad = useMemo(() => {
    const m = {};
    leads.forEach((l) => {
      const c = (l.ubicacion || "").trim();
      if (!c) return;
      m[c] = (m[c] || 0) + 1;
    });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }, [leads]);

  const ganados = leads.filter((l) => l.etapa === "ganado").length;
  const descartados = leads.filter((l) => l.etapa === "descartado").length;
  const activos = total - ganados - descartados;
  const tasaGanados = total ? Math.round((ganados / total) * 100) : 0;

  if (!total) {
    return (
      <div className="rounded-xl border border-dashed border-[#232833] py-14 text-center">
        <p className="text-[14px] text-[#6E7688]">
          Aún no hay datos que mostrar. En cuanto añadas o busques leads, verás aquí la vista global.
        </p>
      </div>
    );
  }

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <TarjetaMetrica etiqueta="Total leads" valor={total} />
        <TarjetaMetrica etiqueta="Pipeline activo" valor={activos} />
        <TarjetaMetrica etiqueta="Ganados" valor={ganados} />
        <TarjetaMetrica etiqueta="Tasa de éxito" valor={`${tasaGanados}%`} />
      </div>

      <div className="grid gap-4 sm:grid-cols-2">
        <div className="rounded-xl border border-[#1E232D] bg-[#0E1219] p-4">
          <h3 className="mb-3 text-[12px] font-medium uppercase tracking-wider text-[#5C6478]">Por etapa del pipeline</h3>
          {porEtapa.map((e) => (
            <Barra key={e.id} label={e.label} valor={e.n} total={total} tono="#E8843C" />
          ))}
        </div>

        <div className="rounded-xl border border-[#1E232D] bg-[#0E1219] p-4">
          <h3 className="mb-3 text-[12px] font-medium uppercase tracking-wider text-[#5C6478]">Por sector</h3>
          {porSector.map((s) => (
            <Barra key={s.id} label={s.label} valor={s.n} total={total} tono={s.tono} />
          ))}
        </div>

        <div className="rounded-xl border border-[#1E232D] bg-[#0E1219] p-4">
          <h3 className="mb-3 text-[12px] font-medium uppercase tracking-wider text-[#5C6478]">Por tecnología Play&go</h3>
          {porTecnologia.map((t) => (
            <Barra key={t.id} label={t.label} valor={t.n} total={total} tono={t.tono} />
          ))}
          {sinTecnologia > 0 && (
            <p className="mt-1 text-[12px] text-[#5C6478]">{sinTecnologia} leads sin tecnología asignada aún.</p>
          )}
        </div>

        <div className="rounded-xl border border-[#1E232D] bg-[#0E1219] p-4">
          <h3 className="mb-3 text-[12px] font-medium uppercase tracking-wider text-[#5C6478]">Ciudades con más leads</h3>
          {porCiudad.length ? porCiudad.map(([ciudad, n]) => (
            <Barra key={ciudad} label={ciudad} valor={n} total={total} tono="#4C8FBF" />
          )) : (
            <p className="text-[12.5px] text-[#5C6478]">Ningún lead tiene ubicación registrada todavía.</p>
          )}
        </div>
      </div>
    </div>
  );
}

function PanelLeadsPanel() {
  const [leads, setLeads] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [vista, setVista] = useState("leads"); // "leads" | "panel"
  const [filtroSector, setFiltroSector] = useState(null);
  const [filtroEtapa, setFiltroEtapa] = useState("todas");
  const [texto, setTexto] = useState("");
  const [buscando, setBuscando] = useState(false);
  const [enfriando, setEnfriando] = useState(false);
  const [sectorBusqueda, setSectorBusqueda] = useState("turismo");
  const [matiz, setMatiz] = useState("");
  const [candidatos, setCandidatos] = useState(null);
  const [historial, setHistorial] = useState([]);
  const [error, setError] = useState("");
  const [aviso, setAviso] = useState("");
  const inputCSV = useRef(null);

  // Carga inicial
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r?.value) setLeads(JSON.parse(r.value));
      } catch { /* clave aún inexistente */ }
      try {
        const rh = await window.storage.get(HISTORIAL_KEY, true);
        if (rh?.value) setHistorial(JSON.parse(rh.value));
      } catch { /* clave aún inexistente */ }
      setCargando(false);
    })();
  }, []);

  // Guardado
  useEffect(() => {
    if (cargando) return;
    window.storage.set(STORAGE_KEY, JSON.stringify(leads)).catch(() => {
      setAviso("Los cambios no se han podido guardar. Exporta a CSV para no perderlos.");
    });
  }, [leads, cargando]);

  useEffect(() => {
    if (cargando) return;
    window.storage.set(HISTORIAL_KEY, JSON.stringify(historial), true).catch(() => {});
  }, [historial, cargando]);

  useEffect(() => {
    if (!aviso) return;
    const t = setTimeout(() => setAviso(""), 5000);
    return () => clearTimeout(t);
  }, [aviso]);

  const visibles = useMemo(() => {
    const q = texto.trim().toLowerCase();
    return leads.filter((l) => {
      if (filtroSector && l.sector !== filtroSector) return false;
      if (filtroEtapa !== "todas" && l.etapa !== filtroEtapa) return false;
      if (!q) return true;
      return [l.empresa, l.ubicacion, l.contacto, l.senal, l.notas]
        .some((v) => (v || "").toLowerCase().includes(q));
    });
  }, [leads, filtroSector, filtroEtapa, texto]);

  const cuentas = useMemo(() => {
    const m = {};
    SECTORES.forEach((s) => { m[s.id] = leads.filter((l) => l.sector === s.id).length; });
    return m;
  }, [leads]);

  const activos = leads.filter((l) => !["ganado", "descartado"].includes(l.etapa)).length;
  const perfilActual = PERFILES_SECTOR[sectorBusqueda] || [];

  const ultimaBusquedaDe = (perfil) => {
    const encontrada = historial.find((h) => h.sector === sectorBusqueda && h.matiz === perfil);
    if (!encontrada) return null;
    return encontrada.manual ? "marcado a mano" : encontrada.fecha;
  };

  const nuevoLead = () => {
    setLeads([{
      id: uid(), empresa: "", sector: filtroSector || "turismo", etapa: "nuevo", tecnologia: "", tecnologia_motivo: "",
      web: "", contacto: "", cargo: "", email: "", linkedin: "", ubicacion: "", senal: "", notas: "",
      creado: new Date().toISOString().slice(0, 10),
    }, ...leads]);
  };

  const lanzarBusqueda = async (matizDirecto) => {
    const matizFinal = matizDirecto !== undefined ? matizDirecto : matiz.trim();
    const hoy = new Date().toISOString().slice(0, 10);
    const yaHoy = historial.find((h) => h.sector === sectorBusqueda && h.matiz === matizFinal && h.fecha === hoy);
    if (yaHoy && !window.confirm(`Ya buscaste esto hoy (${yaHoy.n} resultados). ¿Repetir de todas formas? Esto vuelve a consumir tokens.`)) {
      return;
    }
    setBuscando(true); setError(""); setCandidatos(null);
    try {
      const conocidasSector = leads
        .filter((l) => l.sector === sectorBusqueda)
        .map((l) => l.empresa).filter(Boolean);
      const res = await buscarLeads(sectorDe(sectorBusqueda), matizFinal, conocidasSector);
      const conocidas = new Set(leads.map((l) => (l.empresa || "").toLowerCase().trim()));
      setCandidatos(res.map((c) => ({
        ...c, id: uid(), sector: sectorBusqueda, etapa: "nuevo",
        contacto: "", cargo: "", email: "", linkedin: "",
        creado: new Date().toISOString().slice(0, 10),
        duplicado: conocidas.has((c.empresa || "").toLowerCase().trim()),
        elegido: !conocidas.has((c.empresa || "").toLowerCase().trim()),
      })));
      const nuevaEntrada = {
        id: uid(), sector: sectorBusqueda, matiz: matizFinal,
        fecha: new Date().toISOString().slice(0, 10), n: res.length,
      };
      let historialActual = historial;
      try {
        const rh = await window.storage.get(HISTORIAL_KEY, true);
        if (rh?.value) historialActual = JSON.parse(rh.value);
      } catch { /* nadie ha buscado nada aún */ }
      const historialNuevo = [nuevaEntrada, ...historialActual].slice(0, 80);
      setHistorial(historialNuevo);
    } catch (e) {
      setError(e.message);
    }
    setBuscando(false);
    setEnfriando(true);
    setTimeout(() => setEnfriando(false), 8000);
  };

  const buscarPorPerfil = (perfil) => {
    setMatiz(perfil);
    lanzarBusqueda(perfil);
  };

  const toggleMarcado = (perfil) => {
    const yaMarcado = historial.some((h) => h.sector === sectorBusqueda && h.matiz === perfil);
    if (yaMarcado) {
      setHistorial(historial.filter((h) => !(h.sector === sectorBusqueda && h.matiz === perfil)));
    } else {
      setHistorial([{ id: uid(), sector: sectorBusqueda, matiz: perfil, fecha: "", n: null, manual: true }, ...historial]);
    }
  };

  const añadirElegidos = () => {
    const nuevos = candidatos.filter((c) => c.elegido)
      .map(({ duplicado, elegido, ...l }) => l);
    setLeads([...nuevos, ...leads]);
    setCandidatos(null);
  };

  const exportar = () => {
    const blob = new Blob(["\uFEFF" + aCSV(leads)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `leads-playgo-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importar = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const nuevos = desdeCSV(String(r.result));
        if (!nuevos.length) { setAviso("El archivo no contenía filas válidas."); return; }
        const conocidas = new Set(leads.map((l) => (l.empresa || "").toLowerCase().trim()));
        const sinRepetir = nuevos.filter((n) => !conocidas.has((n.empresa || "").toLowerCase().trim()));
        setLeads([...sinRepetir, ...leads]);
        setAviso(`${sinRepetir.length} leads importados. ${nuevos.length - sinRepetir.length} duplicados omitidos.`);
      } catch {
        setAviso("No se ha podido leer el CSV. Revisa el formato.");
      }
    };
    r.readAsText(f, "utf-8");
    e.target.value = "";
  };

  if (cargando) {
    return (
      <div className="flex min-h-[400px] items-center justify-center bg-[#0A0D13]">
        <Loader2 className="animate-spin text-[#4A5468]" size={22} />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-[#0A0D13] px-5 py-6 font-sans text-[#D6DBE5] sm:px-8">
      <div className="mx-auto max-w-5xl">

        {/* Cabecera */}
        <header className="mb-5 flex flex-wrap items-end justify-between gap-4 border-b border-[#1C212B] pb-5">
          <div>
            <h1 className="text-[22px] font-semibold tracking-tight text-[#F0F3F8]">
              Leads privados · Play&go
            </h1>
            <p className="mt-1 text-[13px] text-[#6E7688]">
              {leads.length} en base · {activos} en pipeline activo · España
            </p>
          </div>
          <div className="flex gap-2">
            <button onClick={nuevoLead}
              className="flex items-center gap-1.5 rounded-lg bg-[#E8843C] px-3.5 py-2 text-[13px] font-medium text-[#0A0D13] transition-opacity hover:opacity-90">
              <Plus size={15} /> Añadir lead
            </button>
            <button onClick={exportar} disabled={!leads.length}
              className="flex items-center gap-1.5 rounded-lg border border-[#2A2F3A] px-3.5 py-2 text-[13px] text-[#A8B0C0] transition-colors hover:border-[#3E4654] disabled:opacity-40">
              <Download size={15} /> Exportar
            </button>
            <button onClick={() => inputCSV.current?.click()}
              className="flex items-center gap-1.5 rounded-lg border border-[#2A2F3A] px-3.5 py-2 text-[13px] text-[#A8B0C0] transition-colors hover:border-[#3E4654]">
              <Upload size={15} /> Importar
            </button>
            <input ref={inputCSV} type="file" accept=".csv,text/csv" onChange={importar} className="hidden" />
          </div>
        </header>

        {/* Selector de vista */}
        <div className="mb-6 flex gap-2">
          <button onClick={() => setVista("leads")}
            className="flex items-center gap-1.5 rounded-lg px-3.5 py-2 text-[13px] font-medium transition-colors"
            style={{ background: vista === "leads" ? "#1F2836" : "transparent", color: vista === "leads" ? "#E8ECF2" : "#6E7688" }}>
            <LayoutGrid size={14} /> Leads
          </button>
          <button onClick={() => setVista("panel")}
            className="flex items-center gap-1.5 rounded-lg px-3.5 py-2 text-[13px] font-medium transition-colors"
            style={{ background: vista === "panel" ? "#1F2836" : "transparent", color: vista === "panel" ? "#E8ECF2" : "#6E7688" }}>
            <BarChart3 size={14} /> Panel de control
          </button>
        </div>

        {aviso && (
          <div className="mb-5 flex items-center gap-2 rounded-lg border border-[#2E3A44] bg-[#131A21] px-3.5 py-2.5 text-[13px] text-[#8FA8B8]">
            <AlertCircle size={14} /> {aviso}
          </div>
        )}

        {vista === "panel" ? (
          <PanelControl leads={leads} />
        ) : (
          <>
            {/* Búsqueda IA */}
            <section className="mb-7 rounded-xl border border-[#1E232D] bg-[#0E1219] p-5">
              <h2 className="mb-3.5 text-[12px] font-medium uppercase tracking-wider text-[#5C6478]">
                Buscar candidatos en la web
              </h2>
              <div className="flex flex-wrap gap-2.5">
                <div className="relative">
                  <select value={sectorBusqueda} onChange={(e) => setSectorBusqueda(e.target.value)}
                    className="appearance-none rounded-lg border border-[#2A2F3A] bg-[#141821] py-2.5 pl-3.5 pr-9 text-[13.5px] text-[#D6DBE5] outline-none focus:border-[#4A5468]">
                    {SECTORES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>
                  <ChevronDown size={14} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[#5C6478]" />
                </div>
                <input
                  value={matiz}
                  onChange={(e) => setMatiz(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && !buscando && !enfriando && lanzarBusqueda()}
                  placeholder="Matiz opcional: cadenas hoteleras, clínicas privadas, Levante…"
                  className="min-w-[240px] flex-1 rounded-lg border border-[#2A2F3A] bg-[#141821] px-3.5 py-2.5 text-[13.5px] text-[#D6DBE5] placeholder-[#4E5666] outline-none focus:border-[#4A5468]"
                />
                <button onClick={lanzarBusqueda} disabled={buscando || enfriando}
                  className="flex items-center gap-2 rounded-lg bg-[#1F2836] px-4 py-2.5 text-[13.5px] font-medium text-[#C8D0DE] transition-colors hover:bg-[#28323F] disabled:opacity-50">
                  {buscando ? <Loader2 size={15} className="animate-spin" /> : <Search size={15} />}
                  {buscando ? "Buscando" : enfriando ? "Espera unos segundos…" : "Buscar"}
                </button>
              </div>

              <div className="mt-3.5">
                <p className="mb-2 text-[11px] uppercase tracking-wide text-[#5C6478]">
                  Perfiles por defecto para {sectorDe(sectorBusqueda).label} · pulsa uno para buscar directamente
                </p>
                <div className="flex flex-wrap gap-1.5">
                  {perfilActual.map((perfil) => {
                    const ultima = ultimaBusquedaDe(perfil);
                    return (
                      <span key={perfil}
                        className="flex items-center gap-1 rounded-full border pl-1 pr-1 py-1 transition-colors"
                        style={{
                          borderColor: ultima ? "#2E9E8F55" : "#2A2F3A",
                          background: ultima ? "#2E9E8F0D" : "#141821",
                        }}
                      >
                        <button
                          onClick={() => toggleMarcado(perfil)}
                          title={ultima ? "Desmarcar" : "Marcar como ya buscado, sin buscar"}
                          className="flex h-4 w-4 shrink-0 items-center justify-center rounded-full border transition-colors"
                          style={{ borderColor: ultima ? "#2E9E8F" : "#3A4150", background: ultima ? "#2E9E8F" : "transparent" }}
                        >
                          {ultima && <Check size={10} className="text-[#0A0D13]" />}
                        </button>
                        <button
                          onClick={() => buscarPorPerfil(perfil)}
                          disabled={buscando || enfriando}
                          title={ultima ? `Última: ${ultima}` : "Sin buscar todavía"}
                          className="px-1.5 text-[12px] transition-colors disabled:opacity-40"
                          style={{ color: ultima ? "#7FBCB0" : "#A8B0C0" }}
                        >
                          {perfil}
                          {ultima && <span className="ml-1.5 text-[10.5px] opacity-70">· {ultima}</span>}
                        </button>
                      </span>
                    );
                  })}
                </div>
              </div>

              <p className="mt-3 text-[11.5px] leading-relaxed text-[#4E5666]">
                Mínimo 10 candidatos por búsqueda, sin datos de contacto todavía (eso ahorra tokens). Una vez guardes los que te interesen, busca el contacto persona a persona desde cada ficha — así solo pagas esa búsqueda por los que de verdad vas a trabajar. Las empresas que ya tienes guardadas de ese sector se excluyen automáticamente.
              </p>

              {historial.length > 0 && (
                <details className="mt-3">
                  <summary className="cursor-pointer text-[11.5px] text-[#5C6478] hover:text-[#8B93A3]">
                    Historial de búsquedas ({historial.length})
                  </summary>
                  <div className="mt-2 space-y-1">
                    {historial.slice(0, 8).map((h) => (
                      <p key={h.id} className="text-[11.5px] text-[#5C6478]">
                        <span className="tabular-nums">{h.fecha}</span> · {sectorDe(h.sector).label}
                        {h.matiz ? ` · ${h.matiz}` : ""} · {h.n} resultados
                      </p>
                    ))}
                  </div>
                </details>
              )}

              {error && (
                <p className="mt-3 flex items-center gap-2 text-[13px] text-[#C4707E]">
                  <AlertCircle size={14} /> {error}
                  <button onClick={() => lanzarBusqueda()} disabled={buscando || enfriando}
                    className="ml-1 underline hover:text-[#D68A96] disabled:opacity-50 disabled:no-underline">
                    {enfriando ? "Espera unos segundos…" : "Reintentar"}
                  </button>
                </p>
              )}

              {candidatos && (
                <div className="mt-4 border-t border-[#1E232D] pt-4">
                  <div className="mb-3 flex items-center justify-between">
                    <p className="text-[13px] text-[#8B93A3]">
                      {candidatos.length} candidatos · marca los que quieras guardar
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setCandidatos(null)}
                        className="rounded-lg px-3 py-1.5 text-[12.5px] text-[#6E7688] hover:text-[#9AA3B5]">
                        Descartar todo
                      </button>
                      <button onClick={añadirElegidos}
                        disabled={!candidatos.some((c) => c.elegido)}
                        className="rounded-lg bg-[#E8843C] px-3.5 py-1.5 text-[12.5px] font-medium text-[#0A0D13] disabled:opacity-40">
                        Guardar seleccionados
                      </button>
                    </div>
                  </div>
                  <div className="space-y-2">
                    {candidatos.map((c, i) => (
                      <button key={c.id}
                        onClick={() => setCandidatos(candidatos.map((x, j) => j === i ? { ...x, elegido: !x.elegido } : x))}
                        className="flex w-full items-start gap-3 rounded-lg border p-3 text-left transition-colors"
                        style={{ borderColor: c.elegido ? "#E8843C55" : "#232833", background: c.elegido ? "#E8843C0D" : "transparent" }}>
                        <span className="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded border"
                          style={{ borderColor: c.elegido ? "#E8843C" : "#3A4150", background: c.elegido ? "#E8843C" : "transparent" }}>
                          {c.elegido && <Check size={11} className="text-[#0A0D13]" />}
                        </span>
                        <span className="min-w-0 flex-1">
                          <span className="flex flex-wrap items-center gap-2">
                            <span className="text-[14px] font-medium text-[#E8ECF2]">{c.empresa}</span>
                            {c.duplicado && (
                              <span className="rounded bg-[#2A2118] px-1.5 py-0.5 text-[10.5px] uppercase tracking-wide text-[#B08A50]">
                                ya en base
                              </span>
                            )}
                            <InsigniaTecnologia id={c.tecnologia} />
                          </span>
                          <span className="mt-0.5 block text-[12px] text-[#6E7688]">
                            {[c.ubicacion, c.web].filter(Boolean).join(" · ")}
                          </span>
                          {c.senal && <span className="mt-1.5 block text-[12.5px] leading-snug text-[#A8B0C0]">{c.senal}</span>}
                          {c.tecnologia_motivo && <span className="mt-1 block text-[12px] leading-snug text-[#6E7688]">{c.tecnologia_motivo}</span>}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </section>

            {/* Filtros */}
            <div className="mb-5 flex flex-wrap items-center gap-2">
              <Chip sector="turismo" activo={!filtroSector} cuenta={leads.length}
                onClick={() => setFiltroSector(null)} />
              {SECTORES.map((s) => (
                <Chip key={s.id} sector={s.id} cuenta={cuentas[s.id]}
                  activo={filtroSector === s.id}
                  onClick={() => setFiltroSector(filtroSector === s.id ? null : s.id)} />
              ))}
            </div>

            <div className="mb-5 flex flex-wrap gap-2.5">
              <div className="relative min-w-[220px] flex-1">
                <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#4E5666]" />
                <input value={texto} onChange={(e) => setTexto(e.target.value)}
                  placeholder="Filtrar por nombre, ciudad, señal…"
                  className="w-full rounded-lg border border-[#2A2F3A] bg-[#0E1219] py-2 pl-9 pr-8 text-[13.5px] text-[#D6DBE5] placeholder-[#4E5666] outline-none focus:border-[#4A5468]" />
                {texto && (
                  <button onClick={() => setTexto("")}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#4E5666] hover:text-[#8B93A3]">
                    <X size={14} />
                  </button>
                )}
              </div>
              <div className="relative">
                <select value={filtroEtapa} onChange={(e) => setFiltroEtapa(e.target.value)}
                  className="appearance-none rounded-lg border border-[#2A2F3A] bg-[#0E1219] py-2 pl-3.5 pr-9 text-[13.5px] text-[#A8B0C0] outline-none focus:border-[#4A5468]">
                  <option value="todas">Todas las etapas</option>
                  {ETAPAS.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
                </select>
                <ChevronDown size={14} className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[#5C6478]" />
              </div>
            </div>

            {/* Listado */}
            {visibles.length === 0 ? (
              <div className="rounded-xl border border-dashed border-[#232833] py-14 text-center">
                <p className="text-[14px] text-[#6E7688]">
                  {leads.length === 0
                    ? "Aún no hay leads. Lanza una búsqueda por sector o añade uno a mano."
                    : "Ningún lead coincide con estos filtros."}
                </p>
              </div>
            ) : (
              <div className="space-y-2.5">
                {visibles.map((l) => (
                  <FichaLead key={l.id} lead={l}
                    onCambiar={(n) => setLeads(leads.map((x) => x.id === n.id ? n : x))}
                    onBorrar={(id) => setLeads(leads.filter((x) => x.id !== id))} />
                ))}
              </div>
            )}
          </>
        )}

        <p className="mt-8 border-t border-[#1C212B] pt-4 text-[12px] text-[#4E5666]">
          Los datos se guardan en una base compartida (Firebase) y los ve cualquiera que acceda con la contraseña y la misma configuración. Exporta a CSV para llevarlos a Sheets o al CRM.
        </p>
      </div>
    </div>
  );
}


/* ── Candado de contraseña ────────────────────────────────────────── */
const CONTRASEÑA_PANEL = "playgo2026"; // cámbiala antes de publicar

function Candado({ onDesbloqueado }) {
  const [valor, setValor] = useState("");
  const [error, setError] = useState(false);
  const entrar = (e) => {
    e.preventDefault();
    if (valor === CONTRASEÑA_PANEL) {
      sessionStorage.setItem("playgo:desbloqueado", "1");
      onDesbloqueado();
    } else {
      setError(true);
    }
  };
  return (
    <div className="flex min-h-screen items-center justify-center bg-[#0A0D13] px-5">
      <form onSubmit={entrar} className="w-full max-w-sm rounded-xl border border-[#1E232D] bg-[#0E1219] p-6">
        <h1 className="text-[18px] font-semibold text-[#F0F3F8]">Leads privados · Play&amp;go</h1>
        <p className="mt-1 text-[12.5px] text-[#6E7688]">Acceso interno — introduce la contraseña.</p>
        <input
          type="password"
          value={valor}
          onChange={(e) => { setValor(e.target.value); setError(false); }}
          autoFocus
          className="mt-4 w-full rounded-lg border px-3 py-2.5 text-[13.5px] text-[#D6DBE5] outline-none"
          style={{ borderColor: error ? "#C4707E" : "#2A2F3A", background: "#141821" }}
        />
        {error && <p className="mt-2 text-[12px] text-[#C4707E]">Contraseña incorrecta.</p>}
        <button type="submit" className="mt-3 w-full rounded-lg bg-[#E8843C] px-4 py-2.5 text-[13.5px] font-medium text-[#0A0D13]">
          Entrar
        </button>
      </form>
    </div>
  );
}

/* ── Pantalla de configuración de Firebase (una vez por navegador) ─── */
function PantallaFirebase({ onListo }) {
  const [texto, setTexto] = useState(localStorage.getItem("playgo:firebase-config") || "");
  const [error, setError] = useState("");
  const [conectando, setConectando] = useState(false);

  const conectar = async () => {
    setError(""); setConectando(true);
    try {
      const config = JSON.parse(texto);
      await inicializarFirebase(config);
      localStorage.setItem("playgo:firebase-config", texto);
      onListo();
    } catch (e) {
      setError("No se pudo conectar. Revisa que hayas pegado el objeto de configuración completo y que la Autenticación anónima esté activada en el proyecto de Firebase.");
    }
    setConectando(false);
  };

  return (
    <div className="flex min-h-screen items-center justify-center bg-[#0A0D13] px-5">
      <div className="w-full max-w-md rounded-xl border border-[#1E232D] bg-[#0E1219] p-6">
        <h2 className="text-[16px] font-semibold text-[#F0F3F8]">Conectar base de datos compartida</h2>
        <p className="mt-2 text-[12.5px] leading-relaxed text-[#6E7688]">
          Pega aquí el objeto <code>firebaseConfig</code> de tu proyecto de Firebase (Configuración del proyecto → tus apps → SDK). Solo hace falta hacerlo una vez por navegador — a partir de ahí todos los que usen esta misma configuración verán los mismos leads.
        </p>
        <textarea
          value={texto}
          onChange={(e) => setTexto(e.target.value)}
          rows={7}
          placeholder={'{\n  "apiKey": "...",\n  "authDomain": "...",\n  "projectId": "...",\n  ...\n}'}
          className="mt-4 w-full rounded-lg border border-[#2A2F3A] bg-[#141821] px-3 py-2.5 font-mono text-[12px] text-[#D6DBE5] outline-none focus:border-[#4A5468]"
        />
        {error && (
          <p className="mt-2 flex items-start gap-1.5 text-[12px] text-[#C4707E]">
            <AlertCircle size={13} className="mt-0.5 shrink-0" /> {error}
          </p>
        )}
        <button onClick={conectar} disabled={conectando || !texto.trim()}
          className="mt-3 w-full flex items-center justify-center gap-2 rounded-lg bg-[#E8843C] px-4 py-2.5 text-[13.5px] font-medium text-[#0A0D13] disabled:opacity-40">
          {conectando && <Loader2 size={14} className="animate-spin" />}
          {conectando ? "Conectando…" : "Conectar y continuar"}
        </button>
      </div>
    </div>
  );
}

/* ── Pantalla de configuración de API key ─────────────────────────── */
function PantallaApiKey({ onListo }) {
  const [valor, setValor] = useState(localStorage.getItem("playgo:api-key") || "");
  const guardar = () => {
    localStorage.setItem("playgo:api-key", valor.trim());
    onListo();
  };
  return (
    <div className="flex min-h-screen items-center justify-center bg-[#0A0D13] px-5">
      <div className="w-full max-w-sm rounded-xl border border-[#1E232D] bg-[#0E1219] p-6">
        <h2 className="text-[16px] font-semibold text-[#F0F3F8]">API key de Anthropic</h2>
        <p className="mt-2 text-[12.5px] leading-relaxed text-[#6E7688]">
          Necesaria para las búsquedas y generación de emails con IA. Se guarda solo en este navegador (localStorage), no se envía a ningún sitio salvo a la API de Anthropic. Cualquiera con acceso a este equipo/navegador podría verla — no es un secreto de servidor.
        </p>
        <input
          type="password"
          value={valor}
          onChange={(e) => setValor(e.target.value)}
          placeholder="sk-ant-..."
          className="mt-4 w-full rounded-lg border border-[#2A2F3A] bg-[#141821] px-3 py-2.5 text-[13.5px] text-[#D6DBE5] outline-none focus:border-[#4A5468]"
        />
        <button onClick={guardar} disabled={!valor.trim()}
          className="mt-3 w-full rounded-lg bg-[#E8843C] px-4 py-2.5 text-[13.5px] font-medium text-[#0A0D13] disabled:opacity-40">
          Guardar y continuar
        </button>
        <button onClick={onListo} className="mt-2 w-full text-[12px] text-[#5C6478] hover:text-[#8B93A3]">
          Saltar por ahora (las funciones de IA no funcionarán)
        </button>
      </div>
    </div>
  );
}

/* ── Raíz de la app ────────────────────────────────────────────────── */
function AppRaiz() {
  const [desbloqueado, setDesbloqueado] = useState(sessionStorage.getItem("playgo:desbloqueado") === "1");
  const [firebaseOk, setFirebaseOk] = useState(false);
  const [comprobando, setComprobando] = useState(true);
  const [apiKeyLista, setApiKeyLista] = useState(!!localStorage.getItem("playgo:api-key"));

  useEffect(() => {
    const guardada = localStorage.getItem("playgo:firebase-config");
    if (!guardada) { setComprobando(false); return; }
    inicializarFirebase(JSON.parse(guardada))
      .then(() => setFirebaseOk(true))
      .catch(() => {})
      .finally(() => setComprobando(false));
  }, []);

  if (!desbloqueado) return <Candado onDesbloqueado={() => setDesbloqueado(true)} />;
  if (comprobando) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-[#0A0D13]">
        <Loader2 className="animate-spin text-[#4A5468]" size={22} />
      </div>
    );
  }
  if (!firebaseOk) return <PantallaFirebase onListo={() => setFirebaseOk(true)} />;
  if (!apiKeyLista) return <PantallaApiKey onListo={() => setApiKeyLista(true)} />;
  return <PanelLeadsPanel />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AppRaiz />);
</script>
</body>
</html>
